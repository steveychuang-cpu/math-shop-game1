<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>数学大掌柜</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(#bde7ff,#f8e6bd);color:#49351f}
button,input{font:inherit}button{cursor:pointer;border:0}
.wrap{max-width:1200px;margin:auto;padding:12px}.head{background:#8c5a32;border:5px solid #f0c66d;border-radius:20px;color:#fff7d6;text-align:center;padding:10px;box-shadow:0 5px 0 #6c4024}
.head b{font-size:28px}.day{margin-top:8px;background:#fff7dc;border:3px solid #e6b64f;border-radius:15px;padding:8px 12px;text-align:center;font-weight:900}
.event{margin:9px 0;background:#fff5d6;border:3px solid #f2bc4c;border-radius:15px;padding:9px;text-align:center;font-weight:800}
.shops{display:grid;grid-template-columns:1fr 1fr;gap:10px}.shop{border:4px solid white;border-radius:22px;padding:10px;box-shadow:0 7px 18px #7a674333}
.red{background:#ffe1df}.blue{background:#dcefff}.shophead{display:flex;justify-content:space-between;align-items:center;color:white;border-radius:15px;padding:9px 11px}.red .shophead{background:#e9676d}.blue .shophead{background:#539ee7}
.name{font-size:21px;font-weight:900}.stats{font-weight:800;font-size:14px}.scene{margin-top:8px;background:#fff8e8;border:3px solid #c98c51;border-radius:16px;padding:8px}
.sign{text-align:center;background:#a5683b;color:#fff3bd;border-radius:10px;padding:5px;font-weight:900}
.shelves{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}.item{background:#fff;border:2px solid #ead2a8;border-radius:12px;padding:7px;text-align:center;min-height:116px}
.emoji{font-size:35px}.iname{font-weight:900;font-size:14px}.meta{font-size:12px;color:#766653}.stock{font-size:13px;font-weight:800}.item button{margin-top:4px;background:#47ae68;color:#fff;border-radius:8px;padding:5px 7px;font-size:12px}.item button.alt{background:#e5a63a}
.customer{margin-top:8px;background:white;border:3px solid #f0ca79;border-radius:14px;padding:9px;min-height:115px}.bubble{background:#fff4c9;border-radius:12px;padding:7px;font-weight:800}.waiting{color:#b56a00}.answer{display:flex;gap:6px;margin-top:7px}.answer input{min-width:0;flex:1;border:2px solid #d7c49c;border-radius:9px;padding:7px}.answer button{background:#ef775e;color:white;border-radius:9px;padding:7px 10px;font-weight:900}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}.main{background:#42ad62;color:white;border-radius:14px;padding:11px 18px;font-weight:900;box-shadow:0 4px 0 #277c40}.second{background:#fff6d8;color:#6d4b25;border:2px solid #d9b665;border-radius:14px;padding:9px 14px;font-weight:800}
.msg{font-size:13px;font-weight:800;margin-top:6px;min-height:18px}.upgrade{margin-top:8px;text-align:center}.upgrade button{background:#8b62c7;color:#fff;border-radius:10px;padding:7px 10px;font-weight:800}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:18px}.box{background:#fff8e8;border:5px solid #e6b454;border-radius:22px;padding:20px;max-width:430px;width:100%;text-align:center}
@media(max-width:760px){.shops{grid-template-columns:1fr}.shelves{grid-template-columns:repeat(3,1fr)}.head b{font-size:24px}}
</style></head>
<body><div class="wrap">
<div class="head"><b>🏪 数学大掌柜</b><div>两家小店，慢慢想，慢慢经营</div></div>
<div class="day" id="day"></div><div class="event" id="event"></div>
<div class="shops"><div class="shop red" id="s0"></div><div class="shop blue" id="s1"></div></div>
<div class="controls"><button class="main" onclick="nextDay()">☀️ 继续下一天</button><button class="second" onclick="finish()">🏁 看看经营结果</button><button class="second" onclick="reset()">↻ 重新开店</button></div>
</div><div class="modal" id="modal"><div class="box"><h2 id="mt"></h2><div id="mb"></div><br><button class="main" onclick="modal.style.display='none'">继续经营</button></div></div>
<script>
const goods=[
["棒棒糖","🍭",2,3,1],["铅笔","✏️",3,5,1],["牛奶","🥛",4,6,1],["面包","🍞",5,8,1],["本子","📒",6,10,1],["果汁","🧃",7,11,1],
["苹果","🍎",8,12,2],["饼干","🍪",10,15,2],["西瓜","🍉",14,20,2],["彩笔","🖍️",16,23,2],
["小熊","🧸",22,32,3],["足球","⚽",28,40,3],["书包","🎒",35,50,3],["玩具车","🚗",40,58,3]];
let P,dayNo,eventMod=1,eventName="";
function player(n){return{name:n,cash:100,lv:1,served:0,earned:0,inv:Object.fromEntries(goods.map((g,i)=>[i,i<4?2:0])),c:null,msg:"先看看货架，想进什么货都可以。"}}
function reset(){P=[player("玩家 1"),player("玩家 2")];dayNo=1;newEvent();P.forEach(newCustomer);render()}
function unlocked(p){return goods.map((g,i)=>({g,i})).filter(x=>x.g[4]<=p.lv)}
function newEvent(){
 let r=Math.random();eventMod=1;
 if(r<.2){eventName="🥛 今天牛奶很受欢迎：牛奶售价多 1 元";eventMod="milk"}
 else if(r<.35){eventName="🚚 批发日：今天进货每件便宜 1 元";eventMod="cheap"}
 else if(r<.5){eventName="🎉 开心日：客人买到东西后会多送你 1 元小费";eventMod="tip"}
 else eventName="🌤️ 今天是普通营业日，好好经营你的小店吧！";
}
function sellPrice(i){return goods[i][3]+(eventMod==="milk"&&goods[i][0]==="牛奶"?1:0)}
function buyPrice(i){return Math.max(1,goods[i][2]-(eventMod==="cheap"?1:0))}
function newCustomer(p){
 let a=unlocked(p),pick=a[Math.floor(Math.random()*a.length)],q=Math.random()<.78?1:2,total=sellPrice(pick.i)*q;
 let pays=[10,20,50,100].filter(x=>x>=total);let pay=Math.random()<.25?total:(pays[Math.floor(Math.random()*pays.length)]||total);
 p.c={i:pick.i,q,total,pay};p.msg=(p.inv[pick.i]||0)<q?"客人会一直等，补到货再卖给他。":"客人来了，算算应该找多少钱。";
}
function stock(pi,i,q){let p=P[pi],cost=buyPrice(i)*q;if(p.cash<cost){p.msg="钱不够啦，换一种进货方法吧。";render();return}p.cash-=cost;p.inv[i]=(p.inv[i]||0)+q;p.msg=`🚚 到货啦！${goods[i][1]}${goods[i][0]} +${q}，花了 ${cost} 元。`;render()}
function sell(pi){let p=P[pi],c=p.c;if(!c)return;if((p.inv[c.i]||0)<c.q){p.msg="货还不够，客人会等着你。";render();return}let v=Number(document.getElementById("a"+pi).value),right=c.pay-c.total;if(v!==right){p.msg=`🤔 再算算：${c.pay} 元减去 ${c.total} 元。`;render();return}p.inv[c.i]-=c.q;p.cash+=c.total+(eventMod==="tip"?1:0);p.earned+=c.total;p.served++;p.msg=`🎉 对啦！找 ${right} 元，交易成功！`;p.c=null;render()}
function upgrade(pi){let p=P[pi],cost=p.lv==1?55:110;if(p.lv>=3){p.msg="已经是最大的商店啦！";render();return}if(p.cash<cost){p.msg=`升级要 ${cost} 元，现在还不够。`;render();return}p.cash-=cost;p.lv++;p.msg="✨ 商店变大了！新的商品可以卖啦！";render()}
function nextDay(){dayNo++;newEvent();P.forEach(p=>{if(!p.c)newCustomer(p)});render()}
function shop(pi){let p=P[pi],c=p.c,lv=["","街角小店","社区商店","欢乐大商店"][p.lv],h=`<div class="shophead"><div class="name">${p.name} · ${lv}</div><div class="stats">💰${p.cash}元　😊${p.served}位</div></div><div class="scene"><div class="sign">🛒 我的货架</div><div class="shelves">`;
 unlocked(p).forEach(({g,i})=>{h+=`<div class="item"><div class="emoji">${g[1]}</div><div class="iname">${g[0]}</div><div class="meta">进 ${buyPrice(i)} · 卖 ${sellPrice(i)} 元</div><div class="stock">库存 ${p.inv[i]||0}</div><button onclick="stock(${pi},${i},1)">进 1 个</button> <button class="alt" onclick="stock(${pi},${i},5)">进 5 个</button></div>`});
 h+=`</div><div class="customer">`;
 if(c){let g=goods[c.i],lack=(p.inv[c.i]||0)<c.q;h+=`<div class="bubble">👧 “老板，我要 ${c.q} 个 ${g[1]}${g[0]}！”<br>一共 <b>${c.total} 元</b>，我给你 <b>${c.pay} 元</b>。</div>${lack?'<div class="waiting">🪑 缺货，我会在这里等你进货。</div>':`<div class="answer"><input id="a${pi}" inputmode="numeric" placeholder="应该找几元？"><button onclick="sell(${pi})">收钱</button></div>`}`}
 else h+=`<div class="bubble">😊 这个客人已经买好东西了。下一天会有新客人来。</div>`;
 let cost=p.lv==1?55:110;h+=`<div class="msg">${p.msg}</div></div><div class="upgrade">${p.lv<3?`<button onclick="upgrade(${pi})">🏗️ 花 ${cost} 元扩大商店，解锁新商品</button>`:"👑 你的商店已经最大啦！"}</div></div>`;return h}
function render(){document.getElementById("day").innerHTML=`☀️ 第 ${dayNo} 天 · 没有倒计时，想好以后再继续`;document.getElementById("event").innerText=eventName;document.getElementById("s0").innerHTML=shop(0);document.getElementById("s1").innerHTML=shop(1)}
function finish(){let score=p=>p.cash+p.served*15+p.lv*30, a=score(P[0]),b=score(P[1]);mt.innerText=a==b?"🤝 两家店一样棒！":a>b?"🏆 玩家 1 的店经营得更好！":"🏆 玩家 2 的店经营得更好！";mb.innerHTML=`玩家 1：💰${P[0].cash}元　服务${P[0].served}位客人<br><br>玩家 2：💰${P[1].cash}元　服务${P[1].served}位客人`;modal.style.display="flex"}
reset();
</script></body></html>
